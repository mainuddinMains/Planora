name: test-frontend.yml
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
jobs:
    test-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '20'

            - name: Install frontend dependencies and run tests
              run: |
                  cd frontend
                  npm install
                  npm test -- --watchAll=false --passWithNoTests
