version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: planora-db
    environment:
      POSTGRES_USER: planora
      POSTGRES_PASSWORD: planora_password
      POSTGRES_DB: planora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planora"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planora-backend
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://planora:planora_password@postgres:5432/planora
      JWT_SECRET: your_super_secure_jwt_secret_change_in_production
      NODE_ENV: development
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planora-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  postgres_data:
